# Публикация сайта на GitHub Pages — работает из России без VPN.
# Запускается после каждого изменения в main (в том числе после сохранения в админке).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Без своего домена сайт открывается по адресу …github.io/amineva-portfolio/.
      # Когда подключим amineva.ru: в Settings → Secrets and variables → Actions → Variables
      # задать SITE_BASE = / и SITE_URL = https://amineva.ru
      - run: npm run build
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/amineva-portfolio' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://reginarisk12022001-ui.github.io' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
