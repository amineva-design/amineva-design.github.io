      heading: Инфографика
      headingEn: Infographics
      text: >-
        Инфографика превращает сложные научные тексты в понятную графику, которая легко
        воспринимается.
      textEn: Infographics turn complex scientific texts into clear visuals that are easy to take in.
      inNav: true
