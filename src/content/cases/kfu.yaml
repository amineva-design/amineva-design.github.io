  - discriminant: section
    value:
      heading: Мемы
      headingEn: Memes
      text: >-
        Мы работали с мемами и трендами, адаптируя актуальные форматы под язык студентов и повестку:
        сессию, приёмную кампанию. Мемы помогали быстро привлечь внимание и усилить эмоциональную
        связь с аудиторией.
      textEn: >-
        We worked with memes and trends, adapting current formats to students’ language and the
        agenda — exam season, admissions. Memes helped grab attention quickly and strengthen the
        emotional connection with the audience.
      inNav: true
