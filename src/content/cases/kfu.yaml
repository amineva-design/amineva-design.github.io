blocks:
  - discriminant: section
    value:
      heading: О кейсе
      headingEn: About the project
      text: >-
        Казанский федеральный университет — один из старейших и крупнейших классических вузов
        России.
      textEn: Kazan Federal University is one of the oldest and largest classical universities in Russia.
      inNav: false
  - discriminant: section
    value:
      heading: Задача
      headingEn: Goal
      text: >-
        Сформировать гибкий визуальный язык для академических и развлекательных публикаций, ускорить
        производство контента и повысить вовлечённость студенческой аудитории.
      textEn: >-
        Build a flexible visual language for both academic and entertaining posts, speed up content
        production and increase engagement with the student audience.
      inNav: true
  - discriminant: section
    value:
      heading: Инструменты
      headingEn: Tools
      text: Figma, Illustrator, Photoshop, PowerPoint, AI tools
      textEn: Figma, Illustrator, Photoshop, PowerPoint, AI tools
      inNav: false
  - discriminant: image
    value:
      image: ../../assets/cases/kfu/intro.png
      alt: Визуал соцсетей КФУ
      altEn: KFU social media visuals
      caption: ''
      captionEn: ''
      wide: false
  - discriminant: section
    value:
      heading: Свобода творчеству
      headingEn: Creative freedom
      text: >-
        В КФУ мне дали редкую свободу экспериментировать: помимо официальной повестки я развивала
        серию креативных афиш, научпоп-форматы и мемы, адаптированные под студенческую культуру. Это
        позволило вывести визуал аккаунтов за пределы шаблона и создавать контент, который
        действительно откликается аудитории.
      textEn: >-
        At KFU I had rare freedom to experiment: alongside the official agenda I developed a series
        of creative posters, pop-science formats and memes tailored to student culture. This took
        the accounts’ visuals beyond templates and produced content that genuinely resonates with
        the audience.
      inNav: true
