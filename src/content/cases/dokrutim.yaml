      alt: Мобильные страницы услуг «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim mobile service pages
      captionEn: ''
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/05.png
      alt: Брендбук «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim brand book
      captionEn: ''
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/06.png
      alt: Шаблоны для соцсетей «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim social media templates
      captionEn: ''
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/07.png
      alt: Визуал для блога «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim blog visuals
      captionEn: ''
  - discriminant: section
    value:
      heading: Реклама в РСЯ
      text: >-
        Реклама показывала низкую узнаваемость, требовались релевантные визуалы для разных
        аудиторий. Изображение должно быть контрастным и хорошо читаться в любом масштабе.
      inNav: true
      headingEn: Yandex Ads
      textEn: >-
        The ads had low recognition, and different audiences needed relevant visuals. Each image had
        to be high-contrast and readable at any size.
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/08.png
      alt: Рекламные креативы для Яндекс РСЯ
      caption: ''
      wide: false
      altEn: Ad creatives for Yandex Ads
      captionEn: ''
  - discriminant: section
    value:
      heading: Итог
      text: >-
        - CTR креативов в РСЯ вырос на 40%: с 0,20% до 0,28%

        - Стоимость лида снизилась примерно на 20%: с ~1200 ₽ до ~960 ₽ за 3 месяца (данные
        маркетолога)

        - Отдельные страницы услуг, акции и блог улучшили навигацию: выросли глубина просмотра и
        время на странице

        - Единая система шаблонов закрывает около 70% типовых задач SMM и экономит время на контент
      inNav: true
      headingEn: Results
      textEn: >-
        - Ad CTR in Yandex Ads grew by 40%: from 0.20% to 0.28%

        - Cost per lead dropped by about 20%: from ~1,200 ₽ to ~960 ₽ over 3 months (marketer’s
        data)

        - Separate service pages, promotions and the blog improved navigation: page depth and time
        on page went up

        - A unified template system covers about 70% of routine SMM tasks and saves time on content
