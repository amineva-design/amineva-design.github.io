title: Докрутим
published: true
order: 1
year: '2026'
direction: B2C, хоумстейджинг
summary: Редизайн сервиса по обустройству квартир. Пересобрала UX/UI и архитектуру сайта под бизнес-задачи
lead: >-
  Пересобрала UX/UI и архитектуру сайта под бизнес-задачи, разработала брендбук и набор рекламных
  креативов
role: Дизайнер отдела маркетинга
duration: 3 месяца, проектная занятость
team: Маркетолог, SEO, SMM, таргетолог, разработчик Bitrix
metrics:
  - value: +40%
    label: CTR креативов в РСЯ (с 0,20% до 0,28%)
    labelEn: ad CTR in Yandex Ads (0.20% → 0.28%)
  - value: −20%
