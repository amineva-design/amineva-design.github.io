title: Докрутим
published: true
order: 1
year: '2026'
direction: B2C, хоумстейджинг
summary: >-
  Редизайн сервиса по обустройству квартир. Пересобрала UX/UI и архитектуру
  сайта под бизнес-задачи
lead: >-
  Пересобрала UX/UI и архитектуру сайта под бизнес-задачи, разработала брендбук
  и набор рекламных креативов
role: Дизайнер отдела маркетинга
duration: 3 месяца, проектная занятость
team: Маркетолог, SEO, SMM, таргетолог, разработчик Bitrix
metrics:
  - value: +40%
    label: CTR креативов в РСЯ (с 0,20% до 0,28%)
  - value: −20%
    label: стоимость лида (с ~1200 ₽ до ~960 ₽)
  - value: ≈70%
    label: типовых задач SMM закрывают шаблоны
cardImage: ../../assets/cases/dokrutim/card-1.png
cardVideo: https://kinescope.io/embed/7XNkhEeHeQC4EhrQeGjTTa
heroImage: ../../assets/cases/dokrutim/hero.png
blocks:
  - discriminant: section
    value:
      heading: О проекте
      text: >-
        «Докрутим» — сервис по обустройству квартир под ключ и хоумстейджингу
        в Москве и области.
      inNav: false
  - discriminant: section
    value:
      heading: Проблема и задачи
      text: |-
        Бизнесу нужно было повысить вовлечённость аудитории и CTR в социальных и рекламных каналах.

        - Сделать компанию заметной и запоминающейся на фоне конкурентов
        - Переосмыслить архитектуру и оформление сайта
        - Запустить блог и акции, чтобы привлечь органический трафик
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/card-1.png
      alt: Обновлённый сайт «Докрутим» на ноутбуке
      caption: ''
      wide: false
  - discriminant: section
    value:
      heading: Исследование
      text: |-
        Провела аудит текущих креативов и сайта, проанализировала показатели в рекламных кабинетах и соцсетях.

        Нашла «узкое горлышко» сайта — отсутствие структуры: не было блока акций, отдельных страниц услуг и блога.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/01.png
      alt: Аудит сайта «Докрутим»
      caption: ''
      wide: false
  - discriminant: section
    value:
      heading: Решение
      text: |-
        - Разработала брендбук и минимальную дизайн-систему: палитра, типографика, правила обрезки фото, шаблоны
        - Спроектировала и внедрила заметный блок акций
        - Создала визуал для блога и соцсетей
        - Подготовила новые рекламные креативы для Яндекс РСЯ
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/02.png
      alt: Структура и страницы сайта «Докрутим»
      caption: ''
      wide: false
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/03.jpg
      alt: Визуал «Докрутим»
      caption: ''
      wide: false
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/04.png
      alt: Мобильные страницы услуг «Докрутим»
      caption: ''
      wide: false
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/05.png
      alt: Брендбук «Докрутим»
      caption: ''
      wide: false
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/06.png
      alt: Шаблоны для соцсетей «Докрутим»
      caption: ''
      wide: false
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/07.png
      alt: Визуал для блога «Докрутим»
      caption: ''
      wide: false
  - discriminant: section
    value:
      heading: Реклама в РСЯ
      text: >-
        Реклама показывала низкую узнаваемость, требовались релевантные визуалы
        для разных аудиторий. Изображение должно быть контрастным и хорошо читаться
        в любом масштабе.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/08.png
      alt: Рекламные креативы для Яндекс РСЯ
      caption: ''
      wide: false
  - discriminant: section
    value:
      heading: Итог
      text: |-
        - CTR креативов в РСЯ вырос на 40%: с 0,20% до 0,28%
        - Стоимость лида снизилась примерно на 20%: с ~1200 ₽ до ~960 ₽ за 3 месяца (данные маркетолога)
        - Отдельные страницы услуг, акции и блог улучшили навигацию: выросли глубина просмотра и время на странице
        - Единая система шаблонов закрывает около 70% типовых задач SMM и экономит время на контент
      inNav: true
