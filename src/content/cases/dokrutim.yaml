blocks:
  - discriminant: section
    value:
      heading: О проекте
      text: «Докрутим» — сервис по обустройству квартир под ключ и хоумстейджингу в Москве и области.
      inNav: false
      headingEn: About the project
      textEn: >-
        “Dokrutim” is a turnkey apartment furnishing and home staging service in Moscow and the
        Moscow region.
  - discriminant: section
    value:
      heading: Проблема и задачи
      text: |-
        Бизнесу нужно было повысить вовлечённость аудитории и CTR в социальных и рекламных каналах.

        - Сделать компанию заметной и запоминающейся на фоне конкурентов
        - Переосмыслить архитектуру и оформление сайта
        - Запустить блог и акции, чтобы привлечь органический трафик
      inNav: true
      headingEn: Problem and goals
      textEn: |-
        The business needed higher audience engagement and CTR across social and ad channels.

        - Make the company noticeable and memorable among competitors
        - Rethink the website’s architecture and visual design
        - Launch a blog and promotions to grow organic traffic
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/card-1.png
      alt: Обновлённый сайт «Докрутим» на ноутбуке
      caption: ''
      wide: false
      altEn: The redesigned Dokrutim website on a laptop
      captionEn: ''
  - discriminant: section
    value:
      heading: Исследование
      text: >-
        Провела аудит текущих креативов и сайта, проанализировала показатели в рекламных кабинетах и
        соцсетях.


        Нашла «узкое горлышко» сайта — отсутствие структуры: не было блока акций, отдельных страниц
        услуг и блога.
      inNav: true
      headingEn: Research
      textEn: >-
        I audited the existing creatives and website and analysed performance in the ad accounts and
        social channels.


        I found the site’s bottleneck — a lack of structure: no promotions block, no separate
        service pages and no blog.
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/01.png
      alt: Аудит сайта «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim website audit
      captionEn: ''
  - discriminant: section
    value:
      heading: Решение
      text: >-
        - Разработала брендбук и минимальную дизайн-систему: палитра, типографика, правила обрезки
        фото, шаблоны

        - Спроектировала и внедрила заметный блок акций

        - Создала визуал для блога и соцсетей

        - Подготовила новые рекламные креативы для Яндекс РСЯ
      inNav: true
      headingEn: Solution
      textEn: >-
        - Created a brand book and a lean design system: palette, typography, photo cropping rules,
        templates

        - Designed and shipped a prominent promotions block

        - Created visuals for the blog and social media

        - Prepared new ad creatives for Yandex Ads
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/02.png
      alt: Структура и страницы сайта «Докрутим»
      caption: ''
      wide: false
      altEn: Dokrutim site structure and pages
      captionEn: ''
  - discriminant: image
    value:
      image: ../../assets/cases/dokrutim/03.jpg
      alt: Визуал «Докрутим»
      caption: ''
