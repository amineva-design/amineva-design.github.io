summary: >-
  Исследование пользовательского опыта в онлайн-шоппинге. Разработала модуль ИИ-стилиста: концепцию,
  точки встраивания и сценарии
lead: >-
  Внедрила ИИ-стилиста в интернет-магазин одежды. Исследовала пользовательский опыт и поведение в
  онлайн-шоппинге
