title: Матур
titleEn: Matur
published: true
order: 3
year: '2025'
direction: E-com, учебный проект
directionEn: E-commerce, academic project
summary: >-
  Исследование пользовательского опыта в онлайн-шоппинге. Разработала модуль
  ИИ-стилиста: концепцию, точки встраивания и сценарии
summaryEn: >-
  Research into the online shopping experience. Designed an AI stylist module:
  concept, integration points and scenarios
lead: >-
  Внедрила ИИ-стилиста в интернет-магазин одежды. Исследовала пользовательский
  опыт и поведение в онлайн-шоппинге
leadEn: >-
  Built an AI stylist into a clothing store. Researched user experience and
  behaviour in online shopping
role: Продуктовый дизайнер
roleEn: Product designer
team: Учебный проект в магистратуре
teamEn: Academic project, master’s programme
metrics:
  - value: '50'
    label: респондентов в глубинном анкетировании
    labelEn: respondents in an in-depth survey
  - value: '3'
    label: адаптива — мобильный, планшет, десктоп
    labelEn: breakpoints — mobile, tablet, desktop
cardImage: ../../assets/cases/matur/cardImage.png
cardImage2: ../../assets/cases/matur/cardImage2.webp
heroImage: ../../assets/cases/matur/heroImage.png
blocks:
  - discriminant: section
    value:
      heading: О проекте
      headingEn: About the project
      text: >-
        Учебный проект в рамках магистерской работы. «Матур» — интернет-магазин
        одежды с ИИ-стилистом для людей, которые устали от масс-маркета и мук
        выбора.
      textEn: >-
        An academic project for my master’s thesis. “Matur” is an online
        clothing store with an AI stylist for people tired of mass market and
        the agony of choice.
      inNav: false
  - discriminant: section
    value:
      heading: Проблема
      headingEn: Problem
      text: >-
        Онлайн-шоппинг стал базовой потребностью: товаров и брендов много,
        времени мало, выбор бесконечный. Люди теряются в каталогах и либо не
        покупают, либо берут «на авось».
      textEn: >-
        Online shopping has become a basic need: there are lots of products and
        brands, little time and endless choice. People get lost in catalogues
        and either don’t buy or pick something at random.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/matur/blocks/2/value/image.webp
      alt: Проблема выбора в онлайн-шоппинге
      altEn: The problem of choice in online shopping
      wide: false
  - discriminant: section
    value:
      heading: Решение
      headingEn: Solution
      text: >-
        Облегчить поиск и выбор одежды с помощью ИИ-стилиста, который помогает
        принять решение быстрее и увереннее.
      textEn: >-
        Make finding and choosing clothes easier with an AI stylist that helps
        people decide faster and with more confidence.
      inNav: true
  - discriminant: section
    value:
      heading: Процесс
      headingEn: Process
      text: >-
        Итеративный подход в четыре этапа: исследование, гипотезы, разработка и
        тестирование, пост-анализ. Так дизайн становится управляемым процессом,
        который опирается на данные и последовательно улучшает продукт.
      textEn: >-
        An iterative four-stage approach: research, hypotheses, design and
        testing, post-analysis. This turns design into a manageable, data-driven
        process that steadily improves the product.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/matur/blocks/5/value/image.png
      alt: Этапы процесса
      altEn: Process stages
      wide: false
  - discriminant: section
    value:
      heading: Исследование
      headingEn: Research
      text: >-
        Анализ целевой аудитории на основе глубинного анкетирования (n = 50).
        Данные помогли понять социальные и поведенческие характеристики
        пользователей.
      textEn: >-
        Target audience analysis based on an in-depth survey (n = 50). The data
        revealed users’ social and behavioural characteristics.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/matur/blocks/7/value/image.webp
      alt: Инфографика по результатам анкетирования
      altEn: Survey results infographic
      wide: false
  - discriminant: section
    value:
      heading: CJM
      headingEn: CJM
      text: >-
        Полный путь пользователя от осознания потребности до пост-покупки. Фокус
        на ключевых болях: сложный поиск, мало релевантных фото и фильтров,
        сомнения на этапе оплаты и возврата.
      textEn: >-
        The full user journey from recognising a need to post-purchase, focused
        on key pain points: hard-to-use search, too few relevant photos and
        filters, doubts at checkout and returns.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/matur/blocks/9/value/image.webp
      alt: Карта пути пользователя (CJM)
      altEn: Customer journey map (CJM)
      wide: false
  - discriminant: section
    value:
      heading: User Flow
      headingEn: User Flow
      text: >-
        Провести пользователя от главной к карточке товара и оформлению заказа с
        минимумом кликов. ИИ-стилист встроен как заметный канал персональных
        рекомендаций в каталоге и карточке товара.
      textEn: >-
        Get the user from the home page to the product page and checkout in as
        few clicks as possible. The AI stylist is built in as a visible channel
        for personal recommendations in the catalogue and on product pages.
      inNav: true
  - discriminant: image
    value:
      image: ../../assets/cases/matur/blocks/11/value/image.webp
      alt: User Flow
      altEn: User flow
      wide: false
  - discriminant: section
    value:
      heading: Экраны
      headingEn: Screens
      text: >-
        Макеты под три адаптива — мобильный, планшет и десктоп — с единой
        визуальной идентичностью и ключевыми сценариями на всех устройствах.
      textEn: >-
        Layouts for three breakpoints — mobile, tablet and desktop — with a
        consistent visual identity and key scenarios on every device.
      inNav: true
