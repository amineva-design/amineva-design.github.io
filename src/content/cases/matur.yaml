  - discriminant: section
    value:
      heading: Итог
      text: >-
        - Спроектирован интерфейс «Матур» с ИИ-стилистом; требования выведены из исследований, а не
        из интуиции

        - Ключевые боли — неопределённость выбора, перегрузка, недоверие к контенту — учтены в
        архитектуре, каталоге и карточке товара; ИИ-стилист работает как навигатор и рекомендатель

        - Проект можно масштабировать: AR-примерка, персональные подборки, система лояльности
      inNav: true
      headingEn: Results
      textEn: >-
        - Designed the “Matur” interface with an AI stylist; requirements came from research, not
        intuition

        - Key pain points — uncertainty of choice, overload, distrust of content — are addressed in
        the architecture, catalogue and product page; the AI stylist acts as a guide and recommender

        - The project can scale with AR try-on, personal selections and a loyalty programme
