  - discriminant: section
    value:
      heading: Итог
      text: |-
        - Спроектирован интерфейс «Матур» с ИИ-стилистом; требования выведены из исследований, а не из интуиции
        - Ключевые боли — неопределённость выбора, перегрузка, недоверие к контенту — учтены в архитектуре, каталоге и карточке товара; ИИ-стилист работает как навигатор и рекомендатель
        - Проект можно масштабировать: AR-примерка, персональные подборки, система лояльности
      inNav: true
