title: Политика конфиденциальности
titleEn: Privacy policy
text: |-
  ## 1. Общие положения

  Настоящая политика обработки персональных данных составлена в соответствии с требованиями Федерального закона от 27.07.2006. № 152-ФЗ «О персональных данных» (далее — Закон о персональных данных) и определяет порядок обработки персональных данных и меры по обеспечению безопасности персональных данных, предпринимаемые Аминевой Региной Равилевной (далее — Оператор).

  1.1. Оператор ставит своей важнейшей целью и условием осуществления своей деятельности соблюдение прав и свобод человека и гражданина при обработке его персональных данных, в том числе защиты прав на неприкосновенность частной жизни, личную и семейную тайну.

  1.2. Настоящая политика Оператора в отношении обработки персональных данных (далее — Политика) применяется ко всей информации, которую Оператор может получить о посетителях веб-сайта https://amineva.ru/.

  ## 2. Основные понятия, используемые в Политике

  2.1. Автоматизированная обработка персональных данных — обработка персональных данных с помощью средств вычислительной техники.

  2.2. Блокирование персональных данных — временное прекращение обработки персональных данных (за исключением случаев, если обработка необходима для уточнения персональных данных).

  2.3. Веб-сайт — совокупность графических и информационных материалов, а также программ для ЭВМ и баз данных, обеспечивающих их доступность в сети интернет по сетевому адресу https://amineva.ru/.

  2.4. Информационная система персональных данных — совокупность содержащихся в базах данных персональных данных и обеспечивающих их обработку информационных технологий и технических средств.

  2.5. Обезличивание персональных данных — действия, в результате которых невозможно определить без использования дополнительной информации принадлежность персональных данных конкретному Пользователю или иному субъекту персональных данных.

  2.6. Обработка персональных данных — любое действие (операция) или совокупность действий (операций), совершаемых с использованием средств автоматизации или без использования таких средств с персональными данными, включая сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление, уничтожение персональных данных.

  2.7. Оператор — государственный орган, муниципальный орган, юридическое или физическое лицо, самостоятельно или совместно с другими лицами организующие и/или осуществляющие обработку персональных данных, а также определяющие цели обработки персональных данных, состав персональных данных, подлежащих обработке, действия (операции), совершаемые с персональными данными.

  2.8. Персональные данные — любая информация, относящаяся прямо или косвенно к определенному или определяемому Пользователю веб-сайта https://amineva.ru/.

  2.9. Персональные данные, разрешенные субъектом персональных данных для распространения, — персональные данные, доступ неограниченного круга лиц к которым предоставлен субъектом персональных данных путем дачи согласия на обработку персональных данных, разрешенных субъектом персональных данных для распространения в порядке, предусмотренном Законом о персональных данных (далее — персональные данные, разрешенные для распространения).

  2.10. Пользователь — любой посетитель веб-сайта https://amineva.ru/.

  2.11. Предоставление персональных данных — действия, направленные на раскрытие персональных данных определенному лицу или определенному кругу лиц.

  2.12. Распространение персональных данных — любые действия, направленные на раскрытие персональных данных неопределенному кругу лиц (передача персональных данных) или на ознакомление с персональными данными неограниченного круга лиц, в том числе обнародование персональных данных в средствах массовой информации, размещение в информационно-телекоммуникационных сетях или предоставление доступа к персональным данным каким-либо иным способом.

  2.13. Трансграничная передача персональных данных — передача персональных данных на территорию иностранного государства органу власти иностранного государства, иностранному физическому или иностранному юридическому лицу.

  2.14. Уничтожение персональных данных — любые действия, в результате которых персональные данные уничтожаются безвозвратно с невозможностью дальнейшего восстановления содержания персональных данных в информационной системе персональных данных и/или уничтожаются материальные носители персональных данных.

  ## 3. Основные права и обязанности Оператора

  3.1. Оператор имеет право:
  - получать от субъекта персональных данных достоверные информацию и/или документы, содержащие персональные данные;
  - в случае отзыва субъектом персональных данных согласия на обработку персональных данных, а также, направления обращения с требованием о прекращении обработки персональных данных, Оператор вправе продолжить обработку персональных данных без согласия субъекта персональных данных при наличии оснований, указанных в Законе о персональных данных;
  - самостоятельно определять состав и перечень мер, необходимых и достаточных для обеспечения выполнения обязанностей, предусмотренных Законом о персональных данных и принятыми в соответствии с ним нормативными правовыми актами, если иное не предусмотрено Законом о персональных данных или другими федеральными законами.

  3.2. Оператор обязан:
  - предоставлять субъекту персональных данных по его просьбе информацию, касающуюся обработки его персональных данных;
  - организовывать обработку персональных данных в порядке, установленном действующим законодательством РФ;
  - отвечать на обращения и запросы субъектов персональных данных и их законных представителей в соответствии с требованиями Закона о персональных данных;
  - сообщать в уполномоченный орган по защите прав субъектов персональных данных по запросу этого органа необходимую информацию в течение 10 дней с даты получения такого запроса;
  - публиковать или иным образом обеспечивать неограниченный доступ к настоящей Политике в отношении обработки персональных данных;
  - принимать правовые, организационные и технические меры для защиты персональных данных от неправомерного или случайного доступа к ним, уничтожения, изменения, блокирования, копирования, предоставления, распространения персональных данных, а также от иных неправомерных действий в отношении персональных данных;
  - прекратить передачу (распространение, предоставление, доступ) персональных данных, прекратить обработку и уничтожить персональные данные в порядке и случаях, предусмотренных Законом о персональных данных;
  - исполнять иные обязанности, предусмотренные Законом о персональных данных.

  ## 4. Основные права и обязанности субъектов персональных данных

  4.1. Субъекты персональных данных имеют право:
  - получать информацию, касающуюся обработки его персональных данных, за исключением случаев, предусмотренных федеральными законами. Сведения предоставляются субъекту персональных данных Оператором в доступной форме, и в них не должны содержаться персональные данные, относящиеся к другим субъектам персональных данных, за исключением случаев, когда имеются законные основания для раскрытия таких персональных данных. Перечень информации и порядок ее получения установлен Законом о персональных данных;
  - требовать от оператора уточнения его персональных данных, их блокирования или уничтожения в случае, если персональные данные являются неполными, устаревшими, неточными, незаконно полученными или не являются необходимыми для заявленной цели обработки, а также принимать предусмотренные законом меры по защите своих прав;
  - выдвигать условие предварительного согласия при обработке персональных данных в целях продвижения на рынке товаров, работ и услуг;
  - на отзыв согласия на обработку персональных данных, а также, на направление требования о прекращении обработки персональных данных;
  - обжаловать в уполномоченный орган по защите прав субъектов персональных данных или в судебном порядке неправомерные действия или бездействие Оператора при обработке его персональных данных;
  - на осуществление иных прав, предусмотренных законодательством РФ.

  4.2. Субъекты персональных данных обязаны:
  - предоставлять Оператору достоверные данные о себе;
  - сообщать Оператору об уточнении (обновлении, изменении) своих персональных данных.

  4.3. Лица, передавшие Оператору недостоверные сведения о себе, либо сведения о другом субъекте персональных данных без согласия последнего, несут ответственность в соответствии с законодательством РФ.

  ## 5. Принципы обработки персональных данных

  5.1. Обработка персональных данных осуществляется на законной и справедливой основе.

  5.2. Обработка персональных данных ограничивается достижением конкретных, заранее определенных и законных целей. Не допускается обработка персональных данных, несовместимая с целями сбора персональных данных.

  5.3. Не допускается объединение баз данных, содержащих персональные данные, обработка которых осуществляется в целях, несовместимых между собой.

  5.4. Обработке подлежат только персональные данные, которые отвечают целям их обработки.

  5.5. Содержание и объем обрабатываемых персональных данных соответствуют заявленным целям обработки. Не допускается избыточность обрабатываемых персональных данных по отношению к заявленным целям их обработки.

  5.6. При обработке персональных данных обеспечивается точность персональных данных, их достаточность, а в необходимых случаях и актуальность по отношению к целям обработки персональных данных. Оператор принимает необходимые меры и/или обеспечивает их принятие по удалению или уточнению неполных или неточных данных.

  5.7. Хранение персональных данных осуществляется в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки персональных данных, если срок хранения персональных данных не установлен федеральным законом, договором, стороной которого, выгодоприобретателем или поручителем по которому является субъект персональных данных. Обрабатываемые персональные данные уничтожаются либо обезличиваются по достижении целей обработки или в случае утраты необходимости в достижении этих целей, если иное не предусмотрено федеральным законом.

  ## 6. Цели обработки персональных данных

  **Цель обработки:** предоставление доступа Пользователю к сервисам, информации и/или материалам, содержащимся на веб-сайте.

  **Персональные данные:**
  - электронный адрес
  - номера телефонов
  - имя

  **Правовые основания:** уставные (учредительные) документы Оператора.

  **Виды обработки персональных данных:** сбор, запись, систематизация, накопление, хранение, уничтожение и обезличивание персональных данных.

  ## 7. Условия обработки персональных данных

  7.1. Обработка персональных данных осуществляется с согласия субъекта персональных данных на обработку его персональных данных.

  7.2. Обработка персональных данных необходима для достижения целей, предусмотренных международным договором Российской Федерации или законом, для осуществления возложенных законодательством Российской Федерации на оператора функций, полномочий и обязанностей.

  7.3. Обработка персональных данных необходима для осуществления правосудия, исполнения судебного акта, акта другого органа или должностного лица, подлежащих исполнению в соответствии с законодательством Российской Федерации об исполнительном производстве.

  7.4. Обработка персональных данных необходима для исполнения договора, стороной которого либо выгодоприобретателем или поручителем по которому является субъект персональных данных, а также для заключения договора по инициативе субъекта персональных данных или договора, по которому субъект персональных данных будет являться выгодоприобретателем или поручителем.

  7.5. Обработка персональных данных необходима для осуществления прав и законных интересов оператора или третьих лиц либо для достижения общественно значимых целей при условии, что при этом не нарушаются права и свободы субъекта персональных данных.

  7.6. Осуществляется обработка персональных данных, доступ неограниченного круга лиц к которым предоставлен субъектом персональных данных либо по его просьбе (далее — общедоступные персональные данные).

  7.7. Осуществляется обработка персональных данных, подлежащих опубликованию или обязательному раскрытию в соответствии с федеральным законом.

  ## 8. Порядок сбора, хранения, передачи и других видов обработки персональных данных

  Безопасность персональных данных, которые обрабатываются Оператором, обеспечивается путем реализации правовых, организационных и технических мер, необходимых для выполнения в полном объеме требований действующего законодательства в области защиты персональных данных.

  8.1. Оператор обеспечивает сохранность персональных данных и принимает все возможные меры, исключающие доступ к персональным данным неуполномоченных лиц.

  8.2. Персональные данные Пользователя никогда, ни при каких условиях не будут переданы третьим лицам, за исключением случаев, связанных с исполнением действующего законодательства либо в случае, если субъектом персональных данных дано согласие Оператору на передачу данных третьему лицу для исполнения обязательств по гражданско-правовому договору.

  8.3. В случае выявления неточностей в персональных данных, Пользователь может актуализировать их самостоятельно, путем направления Оператору уведомление на адрес электронной почты Оператора reginaeamineva@yandex.ru с пометкой «Актуализация персональных данных».

  8.4. Срок обработки персональных данных определяется достижением целей, для которых были собраны персональные данные, если иной срок не предусмотрен договором или действующим законодательством.

  Пользователь может в любой момент отозвать свое согласие на обработку персональных данных, направив Оператору уведомление посредством электронной почты на электронный адрес Оператора reginaeamineva@yandex.ru с пометкой «Отзыв согласия на обработку персональных данных».

  8.5. Вся информация, которая собирается сторонними сервисами, в том числе платежными системами, средствами связи и другими поставщиками услуг, хранится и обрабатывается указанными лицами (Операторами) в соответствии с их Пользовательским соглашением и Политикой конфиденциальности. Субъект персональных данных и/или с указанными документами. Оператор не несет ответственность за действия третьих лиц, в том числе указанных в настоящем пункте поставщиков услуг.

  8.6. Установленные субъектом персональных данных запреты на передачу (кроме предоставления доступа), а также на обработку или условия обработки (кроме получения доступа) персональных данных, разрешенных для распространения, не действуют в случаях обработки персональных данных в государственных, общественных и иных публичных интересах, определенных законодательством РФ.

  8.7. Оператор при обработке персональных данных обеспечивает конфиденциальность персональных данных.

  8.8. Оператор осуществляет хранение персональных данных в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки персональных данных, если срок хранения персональных данных не установлен федеральным законом, договором, стороной которого, выгодоприобретателем или поручителем по которому является субъект персональных данных.

  8.9. Условием прекращения обработки персональных данных может являться достижение целей обработки персональных данных, истечение срока действия согласия субъекта персональных данных, отзыв согласия субъектом персональных данных или требование о прекращении обработки персональных данных, а также выявление неправомерной обработки персональных данных.

  ## 9. Перечень действий, производимых Оператором с полученными персональными данными

  9.1. Оператор осуществляет сбор, запись, систематизацию, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передачу (распространение, предоставление, доступ), обезличивание, блокирование, удаление и уничтожение персональных данных.

  9.2. Оператор осуществляет автоматизированную обработку персональных данных с получением и/или передачей полученной информации по информационно-телекоммуникационным сетям или без таковой.

  ## 10. Трансграничная передача персональных данных

  10.1. Оператор до начала осуществления деятельности по трансграничной передаче персональных данных обязан уведомить уполномоченный орган по защите прав субъектов персональных данных о своем намерении осуществлять трансграничную передачу персональных данных (такое уведомление направляется отдельно от уведомления о намерении осуществлять обработку персональных данных).

  10.2. Оператор до подачи вышеуказанного уведомления, обязан получить от органов власти иностранного государства, иностранных физических лиц, иностранных юридических лиц, которым планируется трансграничная передача персональных данных, соответствующие сведения.

  ## 11. Конфиденциальность персональных данных

  Оператор и иные лица, получившие доступ к персональным данным, обязаны не раскрывать третьим лицам и не распространять персональные данные без согласия субъекта персональных данных, если иное не предусмотрено федеральным законом.

  ## 12. Заключительные положения

  12.1. Пользователь может получить любые разъяснения по интересующим вопросам, касающимся обработки его персональных данных, обратившись к Оператору с помощью электронной почты reginaeamineva@yandex.ru.

  12.2. В данном документе будут отражены любые изменения политики обработки персональных данных Оператором. Политика действует бессрочно до замены ее новой версией.

  12.3. Актуальная версия Политики в свободном доступе расположена в сети Интернет по адресу https://amineva.ru/privacy.
textEn: |-
  This is a translation provided for convenience. The Russian version of this Policy is the governing one.

  ## 1. General provisions

  This personal data processing policy has been drawn up in accordance with Federal Law No. 152-FZ of 27.07.2006 “On Personal Data” (hereinafter, the Personal Data Law) and sets out the procedure for processing personal data and the measures taken to ensure its security by Regina Ravilevna Amineva (hereinafter, the Operator).

  1.1. The Operator’s most important goal and condition for carrying out its activities is to respect human and civil rights and freedoms when processing personal data, including the protection of the rights to privacy and to personal and family secrets.

  1.2. This Operator’s policy on personal data processing (hereinafter, the Policy) applies to all information that the Operator may receive about visitors to the website https://amineva.ru/.

  ## 2. Key terms used in the Policy

  2.1. Automated processing of personal data — processing of personal data using computer technology.

  2.2. Blocking of personal data — temporary suspension of the processing of personal data (except where processing is necessary to clarify personal data).

  2.3. Website — a set of graphic and informational materials, as well as computer programs and databases, that make them available on the internet at https://amineva.ru/.

  2.4. Personal data information system — the set of personal data contained in databases, together with the information technologies and technical means used to process it.

  2.5. Depersonalisation of personal data — actions that make it impossible, without additional information, to determine which specific User or other personal data subject the personal data belongs to.

  2.6. Processing of personal data — any action (operation) or set of actions (operations), performed with or without automation, with personal data, including collection, recording, systematisation, accumulation, storage, clarification (updating, changing), retrieval, use, transfer (distribution, provision, access), depersonalisation, blocking, deletion and destruction of personal data.

  2.7. Operator — a state body, municipal body, legal entity or individual that, alone or jointly with others, organises and/or carries out the processing of personal data and determines the purposes of processing, the personal data to be processed, and the actions (operations) performed with it.

  2.8. Personal data — any information relating directly or indirectly to an identified or identifiable User of the website https://amineva.ru/.

  2.9. Personal data permitted by the subject for distribution — personal data to which the personal data subject has granted access to an unlimited number of persons by giving consent to the processing of personal data permitted for distribution, in the manner prescribed by the Personal Data Law (hereinafter, personal data permitted for distribution).

  2.10. User — any visitor to the website https://amineva.ru/.

  2.11. Provision of personal data — actions aimed at disclosing personal data to a specific person or a specific group of persons.

  2.12. Distribution of personal data — any actions aimed at disclosing personal data to an indefinite group of persons (transfer of personal data) or making personal data available to an unlimited number of persons, including publication in the media, placement in information and telecommunication networks or providing access to personal data in any other way.

  2.13. Cross-border transfer of personal data — transfer of personal data to the territory of a foreign state, to a foreign state authority, a foreign individual or a foreign legal entity.

  2.14. Destruction of personal data — any actions that irreversibly destroy personal data, making it impossible to restore its content in the personal data information system, and/or destroy the physical media containing personal data.

  ## 3. Key rights and obligations of the Operator

  3.1. The Operator has the right to:
  - receive reliable information and/or documents containing personal data from the personal data subject;
  - continue processing personal data without the subject’s consent if the subject withdraws consent or requests that processing stop, where there are grounds specified in the Personal Data Law;
  - independently determine the composition and list of measures necessary and sufficient to fulfil the obligations set out in the Personal Data Law and the regulations adopted under it, unless otherwise provided by the Personal Data Law or other federal laws.

  3.2. The Operator is obliged to:
  - provide the personal data subject, at their request, with information about the processing of their personal data;
  - organise the processing of personal data in the manner established by the current legislation of the Russian Federation;
  - respond to requests and enquiries from personal data subjects and their legal representatives in accordance with the Personal Data Law;
  - provide the authorised body for the protection of the rights of personal data subjects, at its request, with the necessary information within 10 days of receiving such a request;
  - publish or otherwise provide unrestricted access to this Policy;
  - take legal, organisational and technical measures to protect personal data from unlawful or accidental access, destruction, modification, blocking, copying, provision, distribution and other unlawful actions;
  - stop the transfer (distribution, provision, access) of personal data, stop processing and destroy personal data in the manner and cases provided for by the Personal Data Law;
  - perform other duties provided for by the Personal Data Law.

  ## 4. Key rights and obligations of personal data subjects

  4.1. Personal data subjects have the right to:
  - receive information about the processing of their personal data, except as provided by federal laws. The Operator provides this information in an accessible form, and it must not contain personal data relating to other subjects unless there are legal grounds for disclosing such data. The list of information and the procedure for obtaining it are established by the Personal Data Law;
  - demand that the Operator clarify, block or destroy their personal data if it is incomplete, outdated, inaccurate, unlawfully obtained or not necessary for the stated purpose of processing, and take legal measures to protect their rights;
  - require prior consent for the processing of personal data for the purpose of promoting goods, works and services;
  - withdraw consent to the processing of personal data and request that processing stop;
  - appeal against unlawful actions or inaction of the Operator in processing their personal data to the authorised body for the protection of the rights of personal data subjects or in court;
  - exercise other rights provided for by the legislation of the Russian Federation.

  4.2. Personal data subjects are obliged to:
  - provide the Operator with reliable information about themselves;
  - inform the Operator of any clarification (update, change) of their personal data.

  4.3. Persons who have provided the Operator with false information about themselves, or information about another personal data subject without that person’s consent, are liable in accordance with the legislation of the Russian Federation.

  ## 5. Principles of personal data processing

  5.1. Personal data is processed on a lawful and fair basis.

  5.2. Processing of personal data is limited to achieving specific, predetermined and lawful purposes. Processing that is incompatible with the purposes of collection is not permitted.

  5.3. Combining databases containing personal data processed for incompatible purposes is not permitted.

  5.4. Only personal data that meets the purposes of its processing is subject to processing.

  5.5. The content and volume of processed personal data correspond to the stated purposes of processing. Processing of excessive personal data in relation to the stated purposes is not permitted.

  5.6. When processing personal data, its accuracy, sufficiency and, where necessary, relevance to the purposes of processing are ensured. The Operator takes, or ensures that others take, the necessary measures to delete or clarify incomplete or inaccurate data.

  5.7. Personal data is stored in a form that allows the personal data subject to be identified no longer than required by the purposes of processing, unless the storage period is established by federal law or by a contract to which the personal data subject is a party, beneficiary or guarantor. Processed personal data is destroyed or depersonalised once the purposes of processing are achieved or are no longer necessary, unless otherwise provided by federal law.

  ## 6. Purposes of personal data processing

  **Purpose of processing:** providing the User with access to the services, information and/or materials on the website.

  **Personal data:**
  - email address
  - phone numbers
  - name

  **Legal grounds:** the Operator’s statutory (constituent) documents.

  **Types of processing:** collection, recording, systematisation, accumulation, storage, destruction and depersonalisation of personal data.

  ## 7. Conditions for processing personal data

  7.1. Personal data is processed with the consent of the personal data subject.

  7.2. Processing of personal data is necessary to achieve the purposes provided for by an international treaty of the Russian Federation or by law, or to perform the functions, powers and duties assigned to the operator by the legislation of the Russian Federation.

  7.3. Processing of personal data is necessary for the administration of justice or the execution of a judicial act or an act of another body or official subject to enforcement under the legislation of the Russian Federation on enforcement proceedings.

  7.4. Processing of personal data is necessary for the performance of a contract to which the personal data subject is a party, beneficiary or guarantor, or for concluding a contract at the initiative of the personal data subject or a contract under which they will be a beneficiary or guarantor.

  7.5. Processing of personal data is necessary to exercise the rights and legitimate interests of the operator or third parties, or to achieve socially significant goals, provided that the rights and freedoms of the personal data subject are not violated.

  7.6. Personal data is processed to which the personal data subject has granted access to an unlimited number of persons, or at their request (hereinafter, publicly available personal data).

  7.7. Personal data subject to publication or mandatory disclosure in accordance with federal law is processed.

  ## 8. Procedure for collecting, storing, transferring and otherwise processing personal data

  The security of personal data processed by the Operator is ensured through legal, organisational and technical measures necessary to fully comply with the current legislation on personal data protection.

  8.1. The Operator ensures the safety of personal data and takes all possible measures to prevent access to personal data by unauthorised persons.

  8.2. The User’s personal data will never, under any circumstances, be transferred to third parties, except in cases related to compliance with current legislation or where the personal data subject has consented to the Operator transferring the data to a third party to fulfil obligations under a civil law contract.

  8.3. If inaccuracies are found in personal data, the User can update it by sending a notice to the Operator’s email address reginaeamineva@yandex.ru marked “Personal data update”.

  8.4. The period of personal data processing is determined by the achievement of the purposes for which the data was collected, unless another period is provided for by contract or current legislation.

  The User may withdraw consent to the processing of personal data at any time by sending a notice to the Operator’s email address reginaeamineva@yandex.ru marked “Withdrawal of consent to personal data processing”.

  8.5. All information collected by third-party services, including payment systems, communication tools and other service providers, is stored and processed by those parties (Operators) in accordance with their User Agreement and Privacy Policy. The Operator is not responsible for the actions of third parties, including the service providers mentioned in this clause.

  8.6. Prohibitions set by the personal data subject on the transfer (except for granting access) or processing, or conditions of processing (except for obtaining access), of personal data permitted for distribution do not apply to processing in the state, public and other public interests defined by the legislation of the Russian Federation.

  8.7. When processing personal data, the Operator ensures its confidentiality.

  8.8. The Operator stores personal data in a form that allows the personal data subject to be identified no longer than required by the purposes of processing, unless the storage period is established by federal law or by a contract to which the personal data subject is a party, beneficiary or guarantor.

  8.9. Processing of personal data may be terminated when the purposes of processing are achieved, the subject’s consent expires, the subject withdraws consent or requests that processing stop, or unlawful processing is detected.

  ## 9. Actions performed by the Operator with personal data

  9.1. The Operator collects, records, systematises, accumulates, stores, clarifies (updates, changes), retrieves, uses, transfers (distributes, provides, grants access to), depersonalises, blocks, deletes and destroys personal data.

  9.2. The Operator carries out automated processing of personal data, with or without receiving and/or transmitting the information over information and telecommunication networks.

  ## 10. Cross-border transfer of personal data

  10.1. Before starting any cross-border transfer of personal data, the Operator must notify the authorised body for the protection of the rights of personal data subjects of its intention to do so (this notice is sent separately from the notice of intention to process personal data).

  10.2. Before submitting this notice, the Operator must obtain the relevant information from the foreign state authorities, foreign individuals and foreign legal entities to which the cross-border transfer is planned.

  ## 11. Confidentiality of personal data

  The Operator and other persons who have gained access to personal data must not disclose it to third parties or distribute it without the consent of the personal data subject, unless otherwise provided by federal law.

  ## 12. Final provisions

  12.1. The User can get any clarification on questions about the processing of their personal data by contacting the Operator by email at reginaeamineva@yandex.ru.

  12.2. Any changes to the Operator’s personal data processing policy will be reflected in this document. The Policy is valid indefinitely until replaced by a new version.

  12.3. The current version of the Policy is freely available online at https://amineva.ru/privacy.
