headline: Я продуктовый дизайнер, который вырос из веба и графического дизайна
text: >-
  Мне нравится сочетание аналитики, исследований и визуального дизайна, а больше всего — моменты,
  когда удаётся сделать сложное простым и понятным.
hobbies: Помимо дизайна люблю искусство, кино, чтение и путешествия
photos:
  - ../assets/site/about-1.jpg
  - ../assets/site/about-book.jpg
  - ../assets/site/about-plane.jpg
experience:
  - period: апрель — июнь 2026
    company: СпецНовострой, Докрутим
    role: Продуктовый дизайнер (growth / маркетинг), проект
    text: >-
      Проектирование SEO-страниц, создание дизайн-системы и пакета креативов для РСЯ и YouTube.
      Внедрение лид-магнитов, A/B-тесты. Увеличила приход лидов в 2 раза. Работала с маркетингом,
      разработкой и продажами.
    periodEn: April — June 2026
    companyEn: SpetsNovostroy, Dokrutim
    roleEn: Product Designer (growth / marketing), project-based
    textEn: >-
      Designed SEO landing pages, a design system and ad creative packs for Yandex Ads and YouTube.
      Introduced lead magnets and ran A/B tests. Doubled the inflow of leads. Worked closely with
      marketing, development and sales.
  - period: май 2024 — июнь 2026
    company: Казанский федеральный университет
    role: Графический дизайнер
    text: >-
      Графические материалы для соцсетей вуза: карточки, афиши, инфографика, обложки для видео,
      ретушь фотографий, презентации.
    periodEn: May 2024 — June 2026
    companyEn: Kazan Federal University
    roleEn: Graphic Designer
    textEn: >-
      Graphics for the university’s social media: post cards, posters, infographics, video covers,
      photo retouching and presentations.
  - period: 2023 — 2025
    company: Фриланс
    role: Дизайнер
    text: >-
      Интернет-магазины, детские проекты, корпоративные сайты, ритейл, туризм: логотипы, брендинг,
      дизайн и вёрстка сайтов.
    periodEn: 2023 — 2025
    companyEn: Freelance
    roleEn: Designer
    textEn: >-
      E-commerce, kids’ projects, corporate websites, retail and travel: logos, branding, website
      design and build.
